<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntfy Link Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: sans-serif;
            background: #111318;
            color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #353945;
            border-radius: 10px;
            outline: none;
            background: #1c2029;
            color: white;
            font: inherit;
            transition: border 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #818cf8;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .instructions {
            margin: 24px 0 16px;
            color: #aeb4c2;
            font-size: 14px;
            line-height: 1.6;
        }

        .instructions strong {
            color: white;
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #status {
            min-height: 20px;
            margin-top: 14px;
            font-size: 13px;
            color: #a5b4fc;
        }

        #preview {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #1c2029;
            color: #9ca3af;
            font-size: 12px;
            word-break: break-all;
            text-align: left;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h2>ntfy Link Generator</h2>

        <div class="input-group">
            <input
                id="t"
                type="text"
                placeholder="How are you Puppy?~"
                value=""
            >

            <textarea
                id="m"
                placeholder=
"Heyyy! Look at this :3
https://e621.net/posts/6367367
and here is a beautiful spiral!
https://tenor.com/de/view/vixenspiral-spiral-pinkspiral-pendulum-gif-27445762"
            ></textarea>
        </div>

        <div class="instructions">
            <strong>Write a message (Add an image or GIF link to embed it)</strong>
            Generate your notification link and copy it automatically.
            <br>
            Paste it into ControlOS → Open Tab.
        </div>

        <button id="generate" onclick="gen()">
            Generate & Copy
        </button>

        <p id="status" aria-live="polite"></p>

        <div id="preview">
            Your generated link will appear here.
        </div>
    </main>

    <script>
        const titleInput = document.getElementById("t");
        const messageInput = document.getElementById("m");
        const preview = document.getElementById("preview");
        const status = document.getElementById("status");
        const button = document.getElementById("generate");

        function generateUrl() {
            const url = new URL("http://10.45.0.102:9000/hooks/notify");

            if (messageInput.value.trim()) {
                url.searchParams.set("msg", messageInput.value.trim());
            }

            if (titleInput.value.trim()) {
                url.searchParams.set("title", titleInput.value.trim());
            }

            return url.toString();
        }

        async function gen() {
            const url = generateUrl();

            preview.textContent = url;
            status.textContent = "";

            try {
                await navigator.clipboard.writeText(url);

                status.textContent = "✓ Link copied! Paste it into ControlOS → Open Tab.";
                button.textContent = "✓ Copied!";

                setTimeout(() => {
                    button.textContent = "Generate & Copy";
                }, 2000);

            } catch (error) {
                status.textContent = "Clipboard unavailable. Select and copy the link below.";
                preview.textContent = url;
            }
        }

        // Update preview automatically when typing.
        titleInput.addEventListener("input", () => {
            preview.textContent = generateUrl();
        });

        messageInput.addEventListener("input", () => {
            preview.textContent = generateUrl();
        });

        // Initial preview.
        preview.textContent = generateUrl();
    </script>
</body>
</html>
